name: Secret Detection

on:
  push:
    branches: [ master ]
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  secret-scan:
    name: Crenox Secret Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scan template codebase for exposed tokens or private keys
      - name: Run secret detection
        id: crenox
        uses: crenoxhq/crenox@v2.1.10
        continue-on-error: true
        with:
          args: "-r ."
          sarif: "true"

      # Upload findings to GitHub Code Scanning alerts tab
      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: crenox-results.sarif

      # Prevent merging if credentials are committed in starter functions
      - name: Block PR on detected secrets
        if: steps.crenox.outcome == 'failure'
        run: |
          echo "::error::Crenox detected sensitive tokens or credentials in this PR. Build blocked."
          exit 1
